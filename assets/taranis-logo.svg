<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" role="img" aria-label="TARANIS Energy for Africa">
  <defs>
    <linearGradient id="bolt-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#F4B942"/>
      <stop offset="100%" stop-color="#B08728"/>
    </linearGradient>
  </defs>
  <!-- Cercle dark background pour l'éclair -->
  <circle cx="30" cy="30" r="24" fill="#0B2545"/>
  <!-- Éclair (thunderbolt) — Taranis dieu celte de la foudre -->
  <path d="M32 12 L20 32 L28 32 L24 48 L38 26 L30 26 L34 12 Z"
        fill="url(#bolt-gradient)" stroke="#F4B942" stroke-width="0.6" stroke-linejoin="round"/>
  <!-- Wordmark TARANIS -->
  <text x="66" y="34" font-family="'Fraunces', 'Georgia', serif" font-weight="700" font-size="22"
        fill="#0B2545" letter-spacing="0.03em">TARANIS</text>
  <!-- Sous-titre -->
  <text x="66" y="48" font-family="'Inter', -apple-system, sans-serif" font-weight="500" font-size="8"
        fill="#0B2545" letter-spacing="0.22em" text-transform="uppercase">ENERGY FOR AFRICA</text>
</svg>
